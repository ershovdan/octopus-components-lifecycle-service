services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
      - --import-realm
    ports:
      - "8083:8080"
    volumes:
      - ./realms:/opt/keycloak/data/import
  db:
    image: postgres:15
    container_name: postgres_db_test
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  release-engineering:
    image: wiremock/wiremock:3.13.1
    container_name: wiremock-release-engineering
    ports:
      - "8081:8081"
    volumes:
      - ./release-engineering:/home/wiremock
    command: [ "--port=8081" ]
    restart: unless-stopped
  components-registry-service:
    image: wiremock/wiremock:3.13.1
    container_name: wiremock-components-registry
    ports:
      - "8082:8082"
    volumes:
      - ./components-registry-service:/home/wiremock
    command: [ "--port=8082" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/__admin" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: