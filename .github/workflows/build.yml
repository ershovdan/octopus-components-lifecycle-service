name: Gradle Compile & UT

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Start services via Docker Compose
        run: |
          docker-compose -f docker/tests/docker-compose.yml up -d
          # Wait for Postgres (or other DB) to be ready
          docker-compose -f docker/tests/docker-compose.yml exec -T db sh -c "until pg_isready -U \$POSTGRES_USER; do sleep 1; done"

      - name: Build and test with Gradle
        run: ./gradlew clean build

      - name: Stop Docker Compose
        if: always()
        run: docker-compose -f docker/tests/docker-compose.yml down
