name: Gradle Release

on:
  repository_dispatch:
    types: release

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker services
        run: |
          docker compose -f docker/tests/docker-compose.yml up -d
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v2.1.10
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      docker-image: components-lifecycle-service
    secrets: inherit
