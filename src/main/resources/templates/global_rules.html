<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Components Lifecycle Service</title>

    <link th:href="@{/css/compocaste.css}" href="/css/compocaste.css" rel="stylesheet" type="text/css"/>
    <link th:href="@{/css/datatables.min.css}" href="/css/datatables.css" rel="stylesheet">
</head>

<body id="page-top">
    <p style="display: none;" th:text="${canEdit}" id="canEdit"></p>

    <!-- Page Wrapper -->
    <div id="wrapper">
        <th:block th:include="/sidebar_block"></th:block>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <div class="d-sm-flex w-25 align-items-center justify-content-between mb-4 mt-4">
                        <h1 class="h3 mb-0 text-gray-800">Global Rules</h1>
                    </div>

                    <div class="w-100">
                        <div class="d-flex flex-row-reverse float-right">
                            <img id="logout_button" th:src="@{img/logout.png}" class="logout_button" height="25" width="25">
                            <p class="h5 mb-0 mr-2" th:text="${username}" id="username"></p>
                        </div>
                    </div>
                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">
                    <!-- Content Row -->
                    <div class="row">
                        <div class="col-4 mb-4" id="column1">
                            <div class="card border-left-success shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="w-100">
                                                <a href="/globalRules/edit?status=active"><img th:src="@{img/edit.png}" class="float-right edit_button" height="20" width="20"></a>
                                            </div>
                                            <div class="text-success text-lg font-weight-bold">SET ACTIVE</div>
                                            <div id="active_description" class="text-md text-success font-weight-bold"></div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-4 mb-4" id="column2">
                            <div class="card border-left-info shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="w-100">
                                                <a href="/globalRules/edit?status=maintenance"><img th:src="@{img/edit.png}" class="float-right edit_button" height="20" width="20"></a>
                                            </div>
                                            <div class="text-info text-lg font-weight-bold">SET MAINTENANCE</div>
                                            <div id="maintenance_description" class="text-md text-info font-weight-bold"></div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-4 mb-4" id="column3">
                            <div class="card border-left-secondary shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="w-100">
                                            </div>
                                            <div class="text-lg text-secondary font-weight-bold">OTHERWISE SET UNSUPPORTED</div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->
</body>

</html>

<style>

</style>

<script th:src="@{/js/compocaste-base.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script>
    const canEdit = document.getElementById('canEdit').innerHTML === "true"

    document.getElementById('canEdit').remove()

    if (!canEdit) {
        for (let editButton of document.getElementsByClassName('edit_button')) {
            editButton.style.display = 'none'
        }
    }

    document.getElementById("global_rules_li").classList.add("active")

    function getDescription(rule) {
        if (rule["dateFormat"] == null) {
            return "In any case"
        } else if (rule["dateFormat"] === "abs") {
            if (rule["minDate"] != null && rule["maxDate"] == null) {
                return "If created after " + rule["minDate"]
            } else if (rule["minDate"] == null && rule["maxDate"] != null) {
                return"If created before " + rule["maxDate"]
            } else {
                return "If created between " + rule["minDate"] + " and " + rule["maxDate"]
            }
        } else if (rule["dateFormat"] === "rel") {
            return "If created not further than " + rule["timeGap"] + " days ago"
        }
    }

    const activeRule = JSON.parse(httpGet("/api/rules/globalActive"))
    const maintenanceRule = JSON.parse(httpGet("/api/rules/globalMaintenance"))

    document.getElementById("active_description").innerHTML = getDescription(activeRule)
    document.getElementById("maintenance_description").innerHTML = getDescription(maintenanceRule)

</script>
