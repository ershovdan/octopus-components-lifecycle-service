spring.application.name=components-lifecycle-service

# Server configuration - use forwarded headers from gateway
server.forward-headers-strategy=FRAMEWORK
# This tells Spring to use X-Forwarded-* headers to determine the correct base URL
# The gateway should set X-Forwarded-Prefix=/components-lifecycle-service

# Logging configuration
#logging.level.org.octopusden.octopus.lifecycle.api.ComponentsManager=DEBUG

# Actuator health endpoints for Kubernetes probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# OAuth2 Resource Server - JWT configuration for Keycloak
# This property should be provided by Config Server or environment variables
# The API Gateway forwards JWT tokens from Keycloak to this service
# Use issuer-uri for auto-discovery (recommended) OR jwk-set-uri for direct endpoint
# Leave empty if gateway validates JWT and this service should trust the gateway
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:}

# OAuth2 Client - For browser login flow
# This enables the service to redirect users to Keycloak login when accessed directly
# Works in conjunction with Resource Server config and gateway authentication
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:components-lifecycle-service}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Keycloak logout configuration
# This should point to the Keycloak logout endpoint
# Example: https://keycloak.acme.com/realms/f1-qa/protocol/openid-connect/logout
# Leave empty to just clear local session (not recommended for SSO)
keycloak.logout-url=${KEYCLOAK_LOGOUT_URL:}


