spring.application.name=components-lifecycle-service
server.port=8080

spring.profiles.active=test

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.releaseEngineeringUrl=http://localhost:8081/release-engineering/3/admin/component/
app.componentsRegistryServiceUrl=http://localhost:8082/rest/api/2/components/

spring.security.oauth2.client.registration.keycloak.client-id=my-spring-client
spring.security.oauth2.client.registration.keycloak.client-secret=my-client-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8080/login/oauth2/code/keycloak

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8083/realms/realm1
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083/realms/realm1
